name: Release APK

# Runs alongside Release Deploy on every v* tag. Builds the
# tokmato-relay native Android APK under android-relay/ via Gradle and
# publishes a GitHub Release with the APK attached. The release body
# comes from the annotated tag's message — same content `git tag -a`
# took at tag time, no copy/paste step.
#
# Required repo secrets:
#   ANDROID_KEYSTORE_BASE64              Base64-encoded release keystore.
#   ANDROID_KEYSTORE_PASSWORD            Keystore password.
#   ANDROID_KEY_ALIAS                    Key alias inside the keystore.
#   ANDROID_KEY_PASSWORD                 Key password.
#   ANDROID_GOOGLE_SERVICES_JSON_BASE64  Firebase client config (Android),
#                                        same project/package as before.
#
# Firebase Android client config is designed to ship inside the APK;
# security comes from the SHA-256 fingerprint check, not file secrecy.
# We still inject it from a secret rather than committing it so its
# rotation is tracked in repo settings instead of git history.

on:
  push:
    tags:
      - "v*"
    branches:
      - "relay"

concurrency:
  group: release-apk-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build tokmato-relay APK via Gradle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/relay'
    permissions:
      # Required to create / upload assets on the GitHub Release for this tag.
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # Fetch the annotated tag itself (not just the tagged commit)
          # so we can read the tag's body as the GitHub Release notes.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android-relay/app/keystore
          echo "$KEYSTORE_B64" | base64 -d > android-relay/app/keystore/release.keystore
          echo "Keystore restored ($(wc -c < android-relay/app/keystore/release.keystore) bytes)"

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_B64" | base64 -d > android-relay/app/google-services.json
          echo "google-services.json restored ($(wc -c < android-relay/app/google-services.json) bytes)"

      - name: Inject signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android-relay/gradle.properties <<EOF
          RELEASE_STORE_FILE=keystore/release.keystore
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Resolve version code/name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Strip the leading 'v', map maj.min.patch → versionCode.
            TAG_NUM=${GITHUB_REF_NAME#v}
            MAJOR=$(echo "$TAG_NUM" | awk -F. '{print $1+0}')
            MINOR=$(echo "$TAG_NUM" | awk -F. '{print $2+0}')
            PATCH=$(echo "$TAG_NUM" | awk -F. '{print $3+0}')
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            NAME="$TAG_NUM"
          else
            # Branch build — synthesize a versionCode from run number so
            # consecutive APKs install over each other for sideload testing.
            CODE=$((1 + GITHUB_RUN_NUMBER))
            NAME="0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          fi
          echo "RELAY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "RELAY_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Resolved versionCode=$CODE versionName=$NAME"

      - name: Gradle assembleRelease
        working-directory: android-relay
        run: ./gradlew assembleRelease -PrelayVersionCode=$RELAY_VERSION_CODE -PrelayVersionName=$RELAY_VERSION_NAME --no-daemon

      - name: Stage APK with predictable name
        id: stage
        run: |
          SRC=$(find android-relay/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::Gradle did not produce an APK"
            exit 1
          fi
          DEST="tokmato-relay-${RELAY_VERSION_NAME}.apk"
          mv "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Built $(wc -c < "$DEST") bytes -> $DEST"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokmato-relay-apk-${{ github.ref_name }}
          path: ${{ steps.stage.outputs.apk_path }}
          retention-days: 90

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.stage.outputs.apk_path }}
        run: |
          # If a release already exists (manually authored notes, rare),
          # just attach the APK. Otherwise create it using the annotated
          # tag's body as the notes — same content I write at `git tag -a`
          # time, no copy/paste step.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            echo "APK attached to existing release $TAG"
            exit 0
          fi
          git tag -l --format='%(contents:body)' "$TAG" | awk '
            /-----BEGIN SSH SIGNATURE-----/ {
              sub(/-----BEGIN SSH SIGNATURE-----.*/, "")
              print
              exit
            }
            { print }
          ' > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            git tag -l --format='%(contents:subject)' "$TAG" > /tmp/notes.md
            echo "" >> /tmp/notes.md
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --generate-notes \
              --latest --verify-tag \
              "$APK"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --latest --verify-tag \
              "$APK"
          fi
          echo "Release $TAG published with APK attached"
