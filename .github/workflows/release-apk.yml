name: Release APK

# Runs alongside Release Deploy on every v* tag. Builds the Capacitor
# Android wrapper as an arm64-v8a debug APK and attaches it to the
# GitHub Release. Web users keep getting Web Push from the deploy job;
# Android users with the APK get native FCM (priority:high) that
# bypasses Doze on locked screens.
#
# Requires repo secrets:
#   ANDROID_GOOGLE_SERVICES_JSON_BASE64  (base64 of capacitor/android/app/google-services.json)
#
# Debug builds are signed with the Android default debug key — fine
# for sideload to a personal device. To upgrade to a release-signed
# APK, generate a keystore once and add ANDROID_KEYSTORE_BASE64 +
# ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS + ANDROID_KEY_PASSWORD
# secrets, then switch the gradle task to assembleRelease + plumb the
# signing config through android/app/build.gradle.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-apk-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # Required to upload assets to the GitHub Release for this tag.
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # Fetch the annotated tag itself (not just the tagged commit)
          # so we can read the tag's body as the GitHub Release notes.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node 22
        # Capacitor 8 CLI invokes its own Node binary (not Bun) and
        # bails with "requires NodeJS >=22.0.0" when the runner has
        # an older one. setup-node pins the bunx-resolved node.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Capacitor deps
        working-directory: capacitor
        run: bun install --frozen-lockfile

      - name: Restore google-services.json
        env:
          GS_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi
          echo "$GS_B64" | base64 -d > capacitor/android/app/google-services.json
          echo "google-services.json restored ($(wc -c < capacitor/android/app/google-services.json) bytes)"

      - name: Capacitor sync
        working-directory: capacitor
        run: bunx cap sync android

      - name: Build APK
        working-directory: capacitor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK with predictable name
        id: stage
        run: |
          SRC=capacitor/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected APK not found at $SRC"
            ls -R capacitor/android/app/build/outputs/apk || true
            exit 1
          fi
          DEST="tokmato-${{ github.ref_name }}-arm64-v8a.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Built $(wc -c < "$DEST") bytes -> $DEST"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokmato-apk-${{ github.ref_name }}
          path: ${{ steps.stage.outputs.apk_path }}
          retention-days: 90

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.stage.outputs.apk_path }}
        run: |
          # If a release already exists (manually authored notes,
          # uncommon path), just attach the APK. Otherwise create it
          # using the annotated tag's body as the notes — same content
          # I write at `git tag -a` time, no copy/paste step.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            echo "APK attached to existing release $TAG"
            exit 0
          fi
          # `contents:body` strips the first paragraph (the subject
          # line), keeping the structured 主要变化 / 修复 / 工程 body.
          # Awk pass chops the SSH signature block that signed tags
          # append after the body — git glues the BEGIN marker onto
          # the last content line so a plain regex skip doesn't catch
          # it. Cut at the first occurrence regardless of position.
          git tag -l --format='%(contents:body)' "$TAG" | awk '
            /-----BEGIN SSH SIGNATURE-----/ {
              sub(/-----BEGIN SSH SIGNATURE-----.*/, "")
              print
              exit
            }
            { print }
          ' > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            # Lightweight tag or empty body — fall back to subject +
            # auto-generated commit list so the release isn't blank.
            git tag -l --format='%(contents:subject)' "$TAG" > /tmp/notes.md
            echo "" >> /tmp/notes.md
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --generate-notes \
              --latest --verify-tag \
              "$APK"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --latest --verify-tag \
              "$APK"
          fi
          echo "Release $TAG published with APK attached"
