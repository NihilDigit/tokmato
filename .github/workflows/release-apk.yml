name: Release APK

# Runs alongside Release Deploy on every v* tag. Builds the Expo / RN
# app under mobile/ via EAS Build (`--local`, on the GH runner) and
# publishes a GitHub Release with the APK attached. The release body
# comes from the annotated tag's message — same content `git tag -a`
# took at tag time, no copy/paste step.
#
# Required repo secret:
#   EXPO_TOKEN  Expo access token
#               (https://expo.dev/accounts/<user>/settings/access-tokens)
#
# Signing credentials (the release keystore + passwords) live on the
# EAS project — `eas.json` profiles default to `credentialsSource:
# "remote"`, so EAS pulls them at build time rather than requiring CI
# to ship them. To rotate: `eas credentials -p android` interactively.
#
# `mobile/google-services.json` lives in git (the Firebase Android
# client config is designed to ship inside the APK; security comes from
# the SHA-256 fingerprint check, not file secrecy). EAS Build picks it
# up via VCS automatically.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-apk-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build mobile APK via EAS
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # Required to create / upload assets on the GitHub Release for this tag.
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # Fetch the annotated tag itself (not just the tagged commit)
          # so we can read the tag's body as the GitHub Release notes.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root deps (for shared/ workspace)
        run: bun install --frozen-lockfile

      - name: Install mobile deps
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Install EAS CLI
        run: bun add -g eas-cli

      - name: EAS build (local profile, APK)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # `--local` runs the build on this runner instead of Expo's
          # cloud queue. Saves the EAS build credit; output is the
          # same APK shape.
          eas build --platform android --profile production-apk --local --non-interactive --output ../tokmato-mobile.apk

      - name: Stage APK with predictable name
        id: stage
        run: |
          SRC=tokmato-mobile.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::EAS did not produce expected APK at $SRC"
            exit 1
          fi
          DEST="tokmato-${{ github.ref_name }}.apk"
          mv "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Built $(wc -c < "$DEST") bytes -> $DEST"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokmato-apk-${{ github.ref_name }}
          path: ${{ steps.stage.outputs.apk_path }}
          retention-days: 90

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.stage.outputs.apk_path }}
        run: |
          # If a release already exists (manually authored notes, rare),
          # just attach the APK. Otherwise create it using the annotated
          # tag's body as the notes — same content I write at `git tag -a`
          # time, no copy/paste step.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            echo "APK attached to existing release $TAG"
            exit 0
          fi
          # `contents:body` strips the first paragraph (the subject
          # line), keeping the structured 主要变化 / 修复 / 工程 body.
          # Awk pass chops the SSH signature block that signed tags
          # append after the body — git glues the BEGIN marker onto
          # the last content line so a plain regex skip doesn't catch
          # it. Cut at the first occurrence regardless of position.
          git tag -l --format='%(contents:body)' "$TAG" | awk '
            /-----BEGIN SSH SIGNATURE-----/ {
              sub(/-----BEGIN SSH SIGNATURE-----.*/, "")
              print
              exit
            }
            { print }
          ' > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            # Lightweight tag or empty body — fall back to subject +
            # auto-generated commit list so the release isn't blank.
            git tag -l --format='%(contents:subject)' "$TAG" > /tmp/notes.md
            echo "" >> /tmp/notes.md
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --generate-notes \
              --latest --verify-tag \
              "$APK"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --latest --verify-tag \
              "$APK"
          fi
          echo "Release $TAG published with APK attached"
