name: Release Mobile (EAS)

# Sibling to release-apk.yml. Runs on every v* tag, builds the
# Expo / React Native app under mobile/ via EAS Build (Expo's hosted
# Android build pipeline), pulls the resulting APK back into the
# workflow, and attaches it to the GitHub Release for the tag.
#
# Phase 6 transition note:
#   - This workflow is the replacement for release-apk.yml (Capacitor).
#   - Both workflows currently coexist so the release-apk path keeps
#     producing a known-good APK while mobile/ matures. Once a v3.x
#     tag has shipped a mobile/ build successfully and a device test
#     confirms parity (push delivery, OAuth, sync), delete:
#       - .github/workflows/release-apk.yml
#       - capacitor/
#     and rename this file to release-apk.yml.
#
# Required repo secrets (in addition to the existing ANDROID_* ones):
#   EXPO_TOKEN
#       Robot or personal access token from
#       https://expo.dev/accounts/[user]/settings/access-tokens.
#       Used by `eas build` to authenticate with Expo's API.
#
# The Android keystore + google-services.json secrets that
# release-apk.yml uses are reused: EAS Build accepts them via the
# `credentials.json` shape produced in the "Restore credentials" step.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-mobile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-mobile-apk:
    name: Build mobile APK via EAS
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root deps (for shared/ workspace)
        run: bun install --frozen-lockfile

      - name: Install mobile deps
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Install EAS CLI
        run: bun add -g eas-cli

      - name: Restore google-services.json
        env:
          GS_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 secret is not set."
            exit 1
          fi
          echo "$GS_B64" | base64 -d > mobile/google-services.json
          echo "google-services.json restored ($(wc -c < mobile/google-services.json) bytes)"

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p mobile/credentials
          KS=mobile/credentials/release.jks
          echo "$KS_B64" | base64 -d > "$KS"
          cat <<EOF > mobile/credentials.json
          {
            "android": {
              "keystore": {
                "keystorePath": "credentials/release.jks",
                "keystorePassword": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
                "keyAlias": "${{ secrets.ANDROID_KEY_ALIAS }}",
                "keyPassword": "${{ secrets.ANDROID_KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: EAS build (local profile, APK)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # `--local` runs the build on this runner instead of Expo's
          # cloud queue. Saves the EAS build credit; output is the
          # same APK shape.
          eas build --platform android --profile production-apk --local --non-interactive --output ../tokmato-mobile.apk

      - name: Stage APK with predictable name
        id: stage
        run: |
          SRC=tokmato-mobile.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::EAS did not produce expected APK at $SRC"
            exit 1
          fi
          DEST="tokmato-${{ github.ref_name }}-mobile.apk"
          mv "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Built $(wc -c < "$DEST") bytes -> $DEST"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokmato-mobile-apk-${{ github.ref_name }}
          path: ${{ steps.stage.outputs.apk_path }}
          retention-days: 90

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.stage.outputs.apk_path }}
        run: |
          # release-apk.yml creates the release first (with notes from
          # the annotated tag body). We just attach.
          # If for some reason mobile runs before apk on a future tag,
          # `--clobber` keeps it idempotent.
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Mobile APK attached to release $TAG"
